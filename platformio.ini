; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

; La placa es una OLIMEX ESP32-S3-DevKit-Lipo. PlatformIO no trae un board.json
; especifico para ella, asi que se parte del generico devkitc-1 y se pisa el
; unico ajuste de bajo nivel que difiere: el modo de flash es dio, no qio.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=0

; Lector dual PN532 por I2C. Entorno por defecto: `pio run` sin -e compila este.
[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<scanner/>
lib_deps =
	adafruit/Adafruit PN532@^1.3.4

; Scanner I2C de diagnostico general, sin libreria de lector: solo Wire.
; Util para verificar el bus (direcciones, niveles electricos) independiente
; de que chip haya conectado.
;   pio run -e scanner -t upload -t monitor
[env:scanner]
build_src_filter = +<scanner/>
lib_deps =
