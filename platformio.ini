; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sin esto, `pio run` (y `-t upload`) actuaria sobre TODOS los entornos, dejando
; flasheado el ultimo que corra en vez del lector. El scanner se pide con -e.
[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=0

; Lector RFID. Es el entorno por defecto: `pio run` sin -e compila este.
[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<scanner/> -<spi_test/>
lib_deps =
	makerspaceleiden/MFRC522-spi-i2c-uart-async@^1.5.1
	adafruit/Adafruit PN532@^1.3.4

; Scanner I2C de diagnostico, sin librerias de lector: solo Wire.
;   pio run -e scanner -t upload -t monitor
[env:scanner]
build_src_filter = +<scanner/>
lib_deps =

; Prueba del RC522 por SPI en vez de I2C. Ver src/spi_test/spi_test.cpp para
; el cableado (header inferior del modulo, no el lateral I2C).
;   pio run -e spi_test -t upload -t monitor
[env:spi_test]
build_src_filter = +<spi_test/>
lib_deps = makerspaceleiden/MFRC522-spi-i2c-uart-async@^1.5.1
