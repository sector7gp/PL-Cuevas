; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

; La placa es una OLIMEX ESP32-S3-DevKit-Lipo. PlatformIO no trae un board.json
; especifico para ella, asi que se parte del generico devkitc-1 y se pisa el
; unico ajuste de bajo nivel que difiere: el modo de flash es dio, no qio.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
; La particion "spiffs" de default_8MB.csv (1.5 MB) ya existe; LittleFS la usa
; por compatibilidad de nombre, no hace falta un CSV de particiones propio.
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=0
; Define FIRMWARE_VERSION a partir de `git describe` en cada compilacion, para
; que el equipo pueda decir por el log que binario tiene puesto. Ver el script.
extra_scripts = pre:scripts/version.py

; Lector dual PN532 por I2C + DFPlayer Mini por UART1, con la tabla de
; personajes/historias en /config.json sobre LittleFS (carpeta data/, se sube
; aparte con `pio run -t uploadfs`). Entorno por defecto: `pio run` sin -e
; compila este.
[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<scanner/>
lib_deps =
	adafruit/Adafruit PN532@^1.3.4
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit NeoPixel@^1.12.5

; Misma build que el entorno por defecto, pero cargada por red en vez de por
; cable (ArduinoOTA, ver src/ota.h). Exige estar conectado al AP 'Cueva1' y
; que el ESP ya tenga flasheada POR CABLE una version que incluya el modulo
; OTA -- la primera vez no hay forma de evitar el cable.
;   pio run -e ota -t upload     (firmware)
;   pio run -e ota -t uploadfs   (data/: config.json, settings.json, www/)
; upload_port va por IP y NO por cueva1.local a proposito: espota.py resuelve
; con socket.gethostbyname() de Python, que en macOS no consulta mDNSResponder
; -- o sea que el ping y el navegador encuentran cueva1.local pero el uploader
; falla con "Host Not Found". La IP igual es fija: 192.168.4.1 es la que toma
; siempre el softAP del ESP32, y no depende del hostname de settings.json.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.4.1

; Scanner I2C de diagnostico general, sin libreria de lector: solo Wire.
; Util para verificar el bus (direcciones, niveles electricos) independiente
; de que chip haya conectado.
;   pio run -e scanner -t upload -t monitor
[env:scanner]
build_src_filter = +<scanner/>
lib_deps =
